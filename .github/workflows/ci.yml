name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      if: always()
      with:
        files: '**/coverage.cobertura.xml'
        fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build \
          --platform linux/amd64 \
          --tag demoagencia:${{ github.sha }} \
          --tag demoagencia:latest \
          .

    - name: Test Docker image
      timeout-minutes: 2
      run: |
        docker run --rm --platform linux/amd64 --entrypoint ls demoagencia:latest -la /app/Assets/agentes/

  validate-structure:
    name: Validate Project Structure
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate required files
      run: |
        echo "Checking required files..."
        
        required_files=(
          "README.md"
          "RUNBOOK.md"
          "CHECKLIST.md"
          "Dockerfile"
          "docker-compose.yml"
          ".env.example"
          "deploy.sh"
          "validate.sh"
          "Assets/agentes/router.md"
          "Assets/agentes/redator.md"
          "Assets/agentes/hero.md"
          "Assets/agentes/qa.md"
        )
        
        for file in "${required_files[@]}"; do
          if [ -f "$file" ]; then
            echo "✓ $file exists"
          else
            echo "✗ $file missing"
            exit 1
          fi
        done
        
        echo "All required files present!"

    - name: Validate .env.example structure
      run: |
        echo "Checking .env.example structure..."
        
        required_vars=(
          "Telegram__BotToken"
          "OpenRouter__ApiKey"
          "Langfuse__PublicKey"
          "Langfuse__SecretKey"
          "Langfuse__Host"
        )
        
        for var in "${required_vars[@]}"; do
          if grep -q "^$var=" .env.example; then
            echo "✓ $var defined"
          else
            echo "✗ $var missing"
            exit 1
          fi
        done
        
        echo "All required variables present!"

    - name: Validate Dockerfile
      run: |
        echo "Checking Dockerfile..."
        
        if grep -q "FROM mcr.microsoft.com/dotnet" Dockerfile; then
          echo "✓ Base image defined"
        else
          echo "✗ Base image missing"
          exit 1
        fi
        
        if grep -q "HEALTHCHECK" Dockerfile; then
          echo "✓ Healthcheck defined"
        else
          echo "✗ Healthcheck missing"
          exit 1
        fi
        
        echo "Dockerfile valid!"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-and-test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore

    - name: Check for vulnerable packages
      run: |
        echo "Checking for vulnerable packages..."
        dotnet list package --vulnerable --include-transitive || true
        
        echo "Checking for outdated packages..."
        dotnet list package --outdated || true

    - name: Check for secrets
      run: |
        echo "Checking for potential secrets..."
        
        if grep -rE "sk-or-v1-[a-zA-Z0-9_-]{20,}" --include="*.cs" --include="*.json" --exclude-dir="tests" --exclude="AnonimizadorService.cs" . 2>/dev/null; then
          echo "✗ Potential OpenRouter API key found"
          exit 1
        fi
        
        if grep -rE "pk-lf-[a-zA-Z0-9_-]{20,}" --include="*.cs" --include="*.json" --exclude-dir="tests" --exclude="AnonimizadorService.cs" . 2>/dev/null; then
          echo "✗ Potential Langfuse public key found"
          exit 1
        fi
        
        if grep -rE "sk-lf-[a-zA-Z0-9_-]{20,}" --include="*.cs" --include="*.json" --exclude-dir="tests" --exclude="AnonimizadorService.cs" . 2>/dev/null; then
          echo "✗ Potential Langfuse secret key found"
          exit 1
        fi
        
        echo "✓ No obvious secrets found"

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [build-and-test, docker-build, validate-structure, security-scan]
    
    steps:
    - name: Summary
      run: |
        echo "## Pipeline Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "✅ Build and Test: Passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Docker Build: Passed" >> $GITHUB_STEP_SUMMARY
        echo "✅ Project Structure: Valid" >> $GITHUB_STEP_SUMMARY
        echo "✅ Security Scan: Passed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "All checks passed! Ready for deployment." >> $GITHUB_STEP_SUMMARY
