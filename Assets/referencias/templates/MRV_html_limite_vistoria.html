<!doctype html> 
<html>
<head>
<meta charset="utf-8">
<title>{{assunto}}</title>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
<style type="text/css">
    body, html {
        margin: 0 !important;
        padding: 0 !important;
    }
    td img {
        display: block;
        border: 0;
        margin: 0;
        padding: 0;
    }
    table, tr, td {
    border-collapse: collapse;
    border-spacing: 0;
    font-family: sego;
    }
    body, table, tr, td, a, img {
    border: 0;
    outline: none;
    font-family: 'Segoe UI', sans-serif;
    color: #fffffF;
    }
</style>
</head>

<body bgcolor="#f1f1f1" leftmargin="0" topmargin="0" marginwidth="0" marginheight="0">
<span style="display: none; max-height: 0; overflow: hidden; mso-hide: all; font-size: 1px; line-height: 1px; color: #f1f1f1;">{{preheader}}</span>
<table width="600" border="0" align="center" cellpadding="0" cellspacing="0" style="background: #fff">

    <tr>
        <td>
            <table width="600" border="0" align="center" cellpadding="0" cellspacing="0">
                <tbody>
                    {{banner_section}}
                </tbody>
            </table>
        </td>
    </tr>

    {{hero_section}}

    <tr>
        <td>
            <table width="600" border="0" align="center" cellpadding="0" cellspacing="0">
                <tbody>
                    <tr>
                        <td width="40" height="76"></td>
                        <td width="520">
                            <p style="font-family: 'Segoe UI', sans-serif; color: #5D615F; font-size: 18px; line-height: 22px; margin: 0 0 16px; padding: 0;"><span style="font-family: 'Segoe UI', sans-serif; font-size: 19px; line-height: 22px; margin: 0 0 16px; padding: 0; color: #000000;"><strong>Ola, %%NOME%%!</strong></span></p>
                        </td>
                        <td width="40"></td>
                    </tr>
                </tbody>
            </table>
        </td>
    </tr>

    <tr>
        <td style="padding: 0 40px; font-family: 'Segoe UI', sans-serif; font-size: 16px; line-height: 22px; color: #000000;">
            {{corpo}}
        </td>
    </tr>

    <tr>
        <td align="center" style="padding: 20px 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td style="background: #784099; border-radius: 7px; text-align: center;">
                        <a href="{{cta_link}}" target="_blank" style="display: inline-block; padding: 11px 16px; font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; color: #ffffff; text-decoration: none; font-weight: bold; border-radius: 7px;">{{cta_texto}}</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>

    {{footer}}

</table>
</body>
</html>
