<tr>
    <td width="600" style="padding: 0; font-size: 0; line-height: 0; border-radius: 22px; {{header_bg}} {{header_clip}}">
        <table role="presentation" width="600" border="0" cellpadding="0" cellspacing="0" style="width: 100%; max-width: 600px; border-collapse: collapse;">
            <tr>
                <td style="padding: 22px 28px 0 28px;">
                    {{regua_html}}
                </td>
            </tr>
            <tr>
                <td style="padding: 22px 28px 46px 28px;">
                    <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse; width: 100%;">
                        <tr>
                            {{header_colunas}}
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </td>
</tr>

<!--#bloco titulo-->
<td width="57%" valign="middle" align="{{header_titulo_align}}" style="{{header_titulo_padding}}">
    <p style="margin: 0; font-family: 'Segoe UI', Arial, sans-serif; font-size: 26px; line-height: 30px; font-weight: bold; color: {{header_titulo_cor}};">{{header_titulo}}</p>
</td>
<!--#/bloco-->

<!--#bloco hero-->
<td width="43%" valign="middle" align="center" style="padding: 0;">
    <!-- Contorno branco sem preenchimento, deslocado alguns px acima/esquerda da foto.
         Espessura (2px) e deslocamento (12px) sao ajustaveis direto neste asset. -->
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse: collapse;">
        <tr>
            <td style="border: 2px solid #FFFFFF; padding: 12px 0 0 12px;">
                <img src="{{header_hero_src}}" alt="Hero" width="208" border="0" style="display: block; width: 100%; max-width: 208px; height: auto;">
            </td>
        </tr>
    </table>
</td>
<!--#/bloco-->
