<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Acme Corp</title>
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            color: #2D2D2D;
            background: #F7F7F7;
            line-height: 1.6;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            color: #004E89;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }
        .cta-button {
            background: #FF6B35;
            color: white;
            padding: 12px 32px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-top: 2rem;
        }
        .cta-button:hover {
            background: #e55a2b;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Transforme sua produtividade</h1>
        <p>Descubra como a Acme Corp pode ajudar voce a alcançar seus objetivos com ferramentas modernas e intuitivas.</p>
        <a href="#" class="cta-button">Comece agora</a>
    </div>
</body>
</html>
