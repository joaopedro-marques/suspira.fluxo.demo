version: '3.8'

services:
  demoagencia:
    build:
      context: .
      dockerfile: Dockerfile
    image: demoagencia:latest
    container_name: demoagencia
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Telegram__BotToken=${Telegram__BotToken}
      - Telegram__ChatIdsPermitidos=${Telegram__ChatIdsPermitidos:-}
      - OpenRouter__ApiKey=${OpenRouter__ApiKey}
      - OpenRouter__BaseUrl=${OpenRouter__BaseUrl:-https://openrouter.ai/api/v1}
      - OpenRouter__DataCollection=${OpenRouter__DataCollection:-deny}
      - Langfuse__PublicKey=${Langfuse__PublicKey}
      - Langfuse__SecretKey=${Langfuse__SecretKey}
      - Langfuse__Host=${Langfuse__Host:-https://cloud.langfuse.com}
      - Seguranca__AnonimizarDados=${Seguranca__AnonimizarDados:-true}
      - Seguranca__MaxMensagensPorMinuto=${Seguranca__MaxMensagensPorMinuto:-5}
    volumes:
      - ./logs:/app/logs
      - ./Assets:/app/Assets
